{% extends "base.html" %}

{% block title %}Sign In &bull; Integra Outreach{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-logo">❖</div>
      <div>
        <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;">Integra</div>
        <div style="font-size: 11px; color: var(--ids-text-muted);">Control Center</div>
      </div>
    </div>

    <h1 class="auth-title">Sign In</h1>
    <p class="auth-subtitle">Authenticate to access the operational control center.</p>

    <div id="alert-box" class="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="Enter your username" class="form-input">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label for="password">Password</label>
        </div>
        <input type="password" id="password" name="password" required placeholder="Enter your password" class="form-input">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">Sign In</button>
    </form>
  </div>
</div>

<script>
  // Ensure we have a fresh CSRF token upon visiting login
  apiFetch('/api/v1/auth/csrf');

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('alert-box');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Authenticating...';

    try {
      const resp = await apiFetch('/api/v1/auth/login', {
        method: 'POST',
        body: { username, password }
      });
      const data = await resp.json();

      if (resp.ok && data.success) {
        window.location.href = '/dashboard';
      } else {
        const errorMsg = data.error?.message || 'Invalid username or password.';
        showAlert('alert-box', errorMsg, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch (err) {
      showAlert('alert-box', 'Network error. Please check your connection.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
{% endblock %}
