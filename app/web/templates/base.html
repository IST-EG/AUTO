<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Integra Outreach Control Center{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js"></script>
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="/" class="brand">
        Integra Outreach <span class="badge">Control Center</span>
      </a>
      {% if current_user %}
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">
          {{ current_user.username }}
          <span class="role-badge {{ current_user.role }}">{{ current_user.role }}</span>
        </span>
        <a href="/logout" class="btn btn-secondary btn-sm">Logout</a>
      </div>
      {% endif %}
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column;">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">
      &copy; 2026 Integra Outreach Automation &bull; auto.integra-ist.com &bull; Phase 7.1 Foundation
    </div>
  </footer>
</body>
</html>
