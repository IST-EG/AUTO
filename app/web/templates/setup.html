{% extends "base.html" %}

{% block title %}First-Run Setup &bull; Integra Outreach{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card">
    <h1 class="card-title">Initial System Setup</h1>
    <p class="card-subtitle">Create the initial primary OWNER account for the Outreach Control Center.</p>

    <div id="alert-box" class="alert"></div>

    <form id="setup-form">
      <div class="form-group">
        <label for="username">Owner Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="e.g. admin">
      </div>

      <div class="form-group">
        <label for="email">Owner Email</label>
        <input type="email" id="email" name="email" required placeholder="admin@integra-ist.com">
      </div>

      <div class="form-group">
        <label for="password">Strong Password</label>
        <input type="password" id="password" name="password" required placeholder="Min 12 chars (upper, lower, digit, symbol)">
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Create OWNER Account</button>
    </form>
  </div>
</div>

<script>
  // Defensive fallbacks in case client bundle is unavailable or loading
  function _hideAlert(id) {
    if (typeof hideAlert === 'function') {
      hideAlert(id);
    } else {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }
  }

  function _showAlert(id, message, type = 'error') {
    if (typeof showAlert === 'function') {
      showAlert(id, message, type);
    } else {
      const el = document.getElementById(id);
      if (el) {
        el.className = `alert alert-${type}`;
        el.textContent = message;
        el.style.display = 'block';
      }
    }
  }

  document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    _hideAlert('alert-box');

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (password !== confirmPassword) {
      _showAlert('alert-box', 'Passwords do not match.', 'error');
      return;
    }

    if (typeof apiFetch !== 'function') {
      _showAlert('alert-box', 'Application assets are still loading or unavailable. Please refresh the page.', 'error');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Creating Account...';

    try {
      const resp = await apiFetch('/api/v1/setup/bootstrap', {
        method: 'POST',
        body: { username, email, password }
      });
      const data = await resp.json();

      if (resp.ok && data.success) {
        _showAlert('alert-box', 'Owner account created successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = '/login';
        }, 1200);
      } else {
        const detailText = data.error?.details ? ` - ${data.error.details}` : '';
        const errorMsg = (data.error?.message || 'Failed to initialize system.') + detailText;
        _showAlert('alert-box', errorMsg, 'error');
        btn.disabled = false;
        btn.textContent = 'Create OWNER Account';
      }
    } catch (err) {
      _showAlert('alert-box', 'Network error. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Create OWNER Account';
    }
  });
</script>
{% endblock %}
